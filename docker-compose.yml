services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tripforge
      POSTGRES_USER: tripforge
      POSTGRES_PASSWORD: tripforge
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripforge -d tripforge"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tripforge
      SPRING_DATASOURCE_USERNAME: tripforge
      SPRING_DATASOURCE_PASSWORD: tripforge
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
