spring:
  application:
    name: trip-forge
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tripforge}
    username: ${SPRING_DATASOURCE_USERNAME:tripforge}
    password: ${SPRING_DATASOURCE_PASSWORD:tripforge}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}
